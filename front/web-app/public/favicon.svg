<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle glow line -->
  <path d="M64 128 C 160 80, 352 80, 448 128" stroke="rgba(255,255,255,0.15)" stroke-width="4" fill="none" />

  <!-- Minibus Silhouette -->
  <g filter="url(#shadow)" transform="translate(96, 116)">
    <!-- Main Bus Body -->
    <path d="M32 48 C 32 21.5, 53.5 0, 80 0 L 240 0 C 266.5 0, 288 21.5, 288 48 L 288 200 C 288 217.7, 273.7 232, 256 232 L 256 248 C 256 256.8, 248.8 264, 240 264 L 224 264 C 215.2 264, 208 256.8, 208 248 L 208 232 L 112 232 L 112 248 C 112 256.8, 104.8 264, 96 264 L 80 264 C 71.2 264, 64 256.8, 64 248 L 64 232 L 64 232 C 46.3 232, 32 217.7, 32 200 Z" fill="#FFFFFF" />

    <!-- Windshield / Large Glass -->
    <path d="M52 44 C 52 32, 60 24, 72 24 L 248 24 C 260 24, 268 32, 268 44 L 268 112 C 268 116, 264 120, 260 120 L 60 120 C 56 120, 52 116, 52 112 Z" fill="#1E293B" />

    <!-- Windshield Divider -->
    <line x1="160" y1="24" x2="160" y2="120" stroke="#FFFFFF" stroke-width="6" opacity="0.4" />

    <!-- Golden Accent Grille / Brand Stripe -->
    <rect x="76" y="144" width="168" height="12" rx="6" fill="url(#accentGrad)" />

    <!-- Headlights -->
    <circle cx="68" cy="180" r="14" fill="#FBBF24" />
    <circle cx="252" cy="180" r="14" fill="#FBBF24" />

    <!-- Inner light beam shine -->
    <circle cx="68" cy="180" r="8" fill="#FEF08A" />
    <circle cx="252" cy="180" r="8" fill="#FEF08A" />

    <!-- Front Grille vents -->
    <rect x="116" y="172" width="88" height="6" rx="3" fill="#94A3B8" />
    <rect x="126" y="186" width="68" height="6" rx="3" fill="#94A3B8" />

    <!-- Lower Bumper -->
    <rect x="52" y="208" width="216" height="12" rx="6" fill="#0F172A" opacity="0.15" />
  </g>
</svg>